<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Data Unicorn</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  
  <!-- Link external fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pirata+One&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    /* Top nav */
    .top-nav {
      margin-top: 50px;
      display: flex;
      gap: 20px;
    }

    /* =========================
      SIDEBARS
      ========================= */

    .sidebar {
      height: 100vh;
      width: 0;
      position: fixed;
      top: 0;
      background-color: #01254d;
      overflow: hidden;
      padding-top: 60px;
      transition: 0.3s;
      z-index: 1000;
    }


    /* LEFT SIDEBAR */

    .left-sidebar {
      left: 0;
    }

    /* RIGHT SIDEBAR */

    .right-sidebar {
      right: 0;
    }

    /* =========================
   MENU BUTTONS
   ========================= */

    .menu-button {
      position: fixed;
      top: 0;

      width: 50px;
      height: 50px;

      background-color: transparent;
      color: #01254d;

      border: none;
      padding: 0;

      font-size: 24px;
      cursor: pointer;

      z-index: 1001;
    }

    /* LEFT MENU BUTTON */

    .left-menu-button {
      left: 0;
    }

    /* RIGHT MENU BUTTON */

    .right-menu-button {
      right: 0;
    }

    /* Hover */

    .menu-button:hover {
      background-color: #ffffff70;
    }

    /* =========================
      SIDEBAR LINKS
      ========================= */

    .sidebar a {
      display: block;
      padding: 12px 24px;

      color: white;
      text-decoration: none;
      font-size: 20px;
    }

    .sidebar a:hover {
      background-color: #ffffff70;
    }

    .sidebar {
      overflow-x: hidden;
    }

    .left-sidebar .menu-button {
      transform: translateX(50px);
    }

    .right-sidebar .menu-button {
      transform: translateX(-50px);
    }

    /* Graph area */
    .graph-container {
      width: 80%;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;

      background-color: #f5f5f5;
      border: 5px solid #01254d
;
      border-radius: 5px;
    }

    .graph-container h3 {
      margin-top: 0;
      text-align: center;
    }

    /* Input area */
    .data-input {
      margin-bottom: 20px;
      text-align: center;
    }

    .data-input input {
      padding: 8px;
      margin: 5px;
    }

    .data-input button {
      padding: 8px 15px;
      cursor: pointer;
    }

    .chart-wrapper {
    position: relative;
    width: 100%;
    height: 400px;
    }

    /* Canvas */
    #myChart {
      width: 100%;
      height: 100%;
    }

    #main {
      padding: 20px;
      transition: margin-left 0.3s;
    }

    #rightMenuIcon {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    #rightCloseIcon {
      display: none;
      color: #01254d;
      font-size: 24px;
      line-height: 50px;
    }

    .site-header {
      width: 100%;
      height: 80px;
      padding-top: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      font-family: 'Pirata One', fantasy;
      font-size: 25px;
      color: #01254d;

      z-index: 900;
    }

    .site-header img {
      height: 80px;
      width: auto;
    }

  </style>
</head>

<body>

  <header class="site-header">
  <img src="image/favicon.png" alt="Data Fire Logo">
    </h1>Data Unicorn</h1>
  </header>

  <!-- LEFT MENU BUTTON -->
  <button id="leftMenuButton" class="menu-button left-menu-button" onclick="toggleLeftNav()">
    <span id="leftMenuIcon">☰</span>
  </button>


  <!-- LEFT SIDEBAR -->
  <div id="leftSidebar" class="sidebar left-sidebar">

    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Instructions</a>
    <a href="#">Saved Graphs</a>

  </div>


  <!-- RIGHT MENU BUTTON -->
  <button id="rightMenuButton" class="menu-button right-menu-button" onclick="toggleRightNav()">
    <img id="rightMenuIcon" src="image/profile.png" alt="Profile">
    <span id="rightCloseIcon">×</span>
  </button>


  <!-- RIGHT SIDEBAR -->
  <div id="rightSidebar" class="sidebar right-sidebar">

    <a href="#">My Data</a>
    <a href="#">Data Sets</a>
    <a href="#">Profile</a>
    <a href="#">Settings</a>

  </div>

  <!-- MAIN CONTENT -->
  <div id="main">

    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="Calculator.html" target="_blank">Calculator</a>
    </nav>

    <h2>Main Page</h2>
    <p>Content...</p>

    <!-- GRAPH -->
    <div class="graph-container">

      <h3>Data Graph</h3>

      <div class="data-input">

        <label for="xData">X Values:</label>

        <input
          type="text"
          id="xData"
          value="1,2,3,4,5"
        >

        <br>

        <label for="yData">Y Values:</label>

        <input
          type="text"
          id="yData"
          value="2,4,6,8,10"
        >

        <br>

        <button onclick="generateGraph()">
          Generate Graph
        </button>

      </div>

      <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
      </div>

    </div>

  </div>

  <script>

    let graph;

    function toggleLeftNav() {
      const sidebar = document.getElementById("leftSidebar");
      const icon = document.getElementById("leftMenuIcon");
      const main = document.getElementById("main");

      if (sidebar.style.width === "250px") {

        sidebar.style.width = "0";
        main.style.marginLeft = "0";
        icon.textContent = "☰";

      } else {

        sidebar.style.width = "250px";
        main.style.marginLeft = "250px";
        icon.textContent = "×";

      }
    }


    function toggleRightNav() {
      const sidebar = document.getElementById("rightSidebar");
      const profileIcon = document.getElementById("rightMenuIcon");
      const closeIcon = document.getElementById("rightCloseIcon");

      if (sidebar.style.width === "250px") {

        sidebar.style.width = "0";

        profileIcon.style.display = "block";
        closeIcon.style.display = "none";

      } else {

        sidebar.style.width = "250px";

        profileIcon.style.display = "none";
        closeIcon.style.display = "block";

      }
    }

    function generateGraph() {

      // Get the data from the input boxes
      let xInput = document.getElementById("xData").value;
      let yInput = document.getElementById("yData").value;

      // Convert the comma-separated text into arrays
      let xValues = xInput.split(",").map(Number);
      let yValues = yInput.split(",").map(Number);

      // Make sure both arrays have the same number of values
      if (xValues.length !== yValues.length) {
        alert("X and Y must contain the same number of values.");
        return;
      }

      // Delete the old graph
      if (graph) {
        graph.destroy();
      }

      // Get the canvas
      let canvas = document.getElementById("myChart");

      // Create the graph
      graph = new Chart(canvas, {

        type: "line",

        data: {
          labels: xValues,

          datasets: [{
            label: "Data",
            data: yValues,

            borderColor: "#54befc",
            backgroundColor: "#54befc",

            borderWidth: 3,
            fill: false,
            tension: 0.2,

            pointBackgroundColor: "#ffffff",
            pointBorderColor: "#54befc",
            pointBorderWidth: 2,
            pointRadius: 5
          }]

        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          scales: {
            x: {
              title: {
                display: true,
                text: "X"
              }
            },

            y: {
              title: {
                display: true,
                text: "Y"
              }
            }
          }

        }

      });

    }

    // Generate the initial graph
    generateGraph();

  </script>

</body>
</html>

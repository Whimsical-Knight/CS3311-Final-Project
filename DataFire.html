<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Data Fire</title>
  <link rel="icon" type="image/png" href="image/favicon.png">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    /* Top nav */
    .top-nav {
      margin-top: 50px;
      display: flex;
      gap: 20px;
    }

    /* Sidebar */
    .sidebar {
      height: 100vh;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #222;
      overflow-x: hidden;
      padding-top: 60px;
      transition: 0.3s;
      z-index: 1000;
    }

    /* Sidebar links */
    .sidebar a {
      display: block;
      padding: 12px 24px;
      color: white;
      text-decoration: none;
      font-size: 20px;
    }

    .sidebar a:hover {
      background-color: #444;
    }

    /* Close button */
    .sidebar .closebtn {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 36px;
      padding: 0;
    }

    /* Main content */
    #main {
      padding: 20px;
      transition: margin-left 0.3s;
    }

    /* Open button */
    .openbtn {
      position: fixed;
      top: 0;
      left: 0;

      font-size: 12px;
      cursor: pointer;
      background-color: #222;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 0px;
    }

    .openbtn:hover {
      background-color: #444;
    }

    /* Graph area */
    .graph-container {
      width: 80%;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;

      background-color: #f5f5f5;
      border: 2px solid #222;
      border-radius: 10px;
    }

    .graph-container h3 {
      margin-top: 0;
      text-align: center;
    }

    /* Input area */
    .data-input {
      margin-bottom: 20px;
      text-align: center;
    }

    .data-input input {
      padding: 8px;
      margin: 5px;
    }

    .data-input button {
      padding: 8px 15px;
      cursor: pointer;
    }

    .chart-wrapper {
    position: relative;
    width: 100%;
    height: 400px;
    }

    /* Canvas */
    #myChart {
      width: 100%;
      height: 100%;
    }

  </style>
</head>

<body>

  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="Calculator.html" target="_blank">Calculator</a>
  </nav>

  <!-- Sidebar -->
  <div id="Sidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="#">About</a>
    <a href="#">Instructions</a>
    <a href="#">Saved Graphs</a>
    <a href="#">My Data Sets</a>
    <a href="#">Profile</a>
  </div>

  <!-- Main content -->
  <div id="main">

    <button class="openbtn" onclick="openNav()">☰ Menu</button>

    <h2>Main Page</h2>
    <p>Content...</p>

    <!-- Graph -->
    <div class="graph-container">

      <h3>Data Graph</h3>

      <div class="data-input">

        <label for="xData">X Values:</label>
        <input
          type="text"
          id="xData"
          value="1,2,3,4,5"
        >

        <br>

        <label for="yData">Y Values:</label>
        <input
          type="text"
          id="yData"
          value="2,4,6,8,10"
        >

        <br>

        <button onclick="generateGraph()">
          Generate Graph
        </button>

      <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
      </div>

    </div>

  </div>

  <script>

    let graph;

    function openNav() {
      document.getElementById("Sidebar").style.width = "250px";
      document.getElementById("main").style.marginLeft = "250px";
    }

    function closeNav() {
      document.getElementById("Sidebar").style.width = "0";
      document.getElementById("main").style.marginLeft = "0";
    }

    function generateGraph() {

      // Get the data from the input boxes
      let xInput = document.getElementById("xData").value;
      let yInput = document.getElementById("yData").value;

      // Convert the comma-separated text into arrays
      let xValues = xInput.split(",").map(Number);
      let yValues = yInput.split(",").map(Number);

      // Make sure both arrays have the same number of values
      if (xValues.length !== yValues.length) {
        alert("X and Y must contain the same number of values.");
        return;
      }

      // Delete the old graph
      if (graph) {
        graph.destroy();
      }

      // Get the canvas
      let canvas = document.getElementById("myChart");

      // Create the graph
      graph = new Chart(canvas, {

        type: "line",

        data: {
          labels: xValues,

          datasets: [{
            label: "Data",
            data: yValues,

            borderWidth: 2,

            fill: false,

            tension: 0.2
          }]
        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          scales: {
            x: {
              title: {
                display: true,
                text: "X"
              }
            },

            y: {
              title: {
                display: true,
                text: "Y"
              }
            }
          }

        }

      });

    }

    // Generate the initial graph
    generateGraph();

  </script>

</body>
</html>
